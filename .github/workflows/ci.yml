name: CI

on:
  push:
  pull_request:

# The jobs only read the checkout; nothing here publishes, comments, or tags.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: Install tools and package
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .
      # The same two commands the pre-commit hooks run, so a commit that passed
      # locally cannot fail here for a formatting reason.
      - name: ruff check
        run: ruff check .
      - name: ruff format
        run: ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: Install tools and package
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .
      - name: mypy
        run: mypy .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: Install tools and package
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .
      - name: pytest with coverage
        run: |
          coverage run -m pytest
          coverage report -m
