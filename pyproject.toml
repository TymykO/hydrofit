[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hydrofit"
version = "0.1.0"
description = "Fit polynomials to instrument curves and export coefficient tables"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Oleksandr Tymkiv" }]
dependencies = [
    "numpy",
    "matplotlib",
    "openpyxl",
]

[project.scripts]
hydrofit = "hydrofit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hydrofit"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Ruff defaults (E4, E7, E9, F) plus docstrings and unused-argument checks.
select = ["E4", "E7", "E9", "F", "D", "ARG"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true

# openpyxl ships neither a py.typed marker nor stubs, so strict mode cannot see its API. The
# exemption is scoped to that one package instead of relaxing the setting globally, and the
# importer converts every value it reads into hydrofit's own types at the boundary — nothing
# untyped travels further than the cell it came from.
[[tool.mypy.overrides]]
module = ["openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# A rank-deficient fit must reach the caller as a number, never as a warning nobody reads.
# Promoted to an error so that any RankWarning raised anywhere in the suite stops it, rather
# than scrolling past. Observed red on a throwaway probe that raised one on purpose.
filterwarnings = ["error::numpy.exceptions.RankWarning"]

[tool.coverage.run]
source = ["src/hydrofit"]
