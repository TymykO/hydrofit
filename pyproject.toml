[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hydrofit"
version = "0.1.0"
description = "Fit polynomials to instrument curves and export coefficient tables"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Oleksandr Tymkiv" }]
dependencies = [
    "numpy",
    "matplotlib",
    "openpyxl",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hydrofit"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Ruff defaults (E4, E7, E9, F) plus docstrings and unused-argument checks.
select = ["E4", "E7", "E9", "F", "D", "ARG"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/hydrofit"]
